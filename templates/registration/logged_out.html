{% extends "layouts/base.html" %}

{% block title %} Logout {% endblock %}

{% block content %}

<!-- [ auth-logout ] start -->
<div class="auth-wrapper">
  <div class="auth-content">
    <div class="card">
      <div class="row align-items-center text-center">
        <div class="col-md-12">
          <div class="card-body">

            <img src="/static/assets/images/logo-dark.png" alt="Logo" class="img-fluid mb-4">

            <h4 class="mb-3 f-w-400">You have been logged out</h4>
            <p class="text-muted mb-4">Thank you for using Task Manager.</p>

            <div class="d-grid gap-2">
              <a href="{% url 'login' %}" class="btn btn-primary mb-2">Sign In Again</a>
              <a href="/" class="btn btn-outline-secondary">Return to Home</a>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- [ auth-logout ] end -->

{% endblock content %}

{% block javascripts %}{% endblock javascripts %}
