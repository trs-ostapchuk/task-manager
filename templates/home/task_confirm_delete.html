{% extends "layouts/base.html" %}
{% load static %}

{% block content %}
<div class="pcoded-main-container">
  <div class="pcoded-content">

    <!-- Page Header -->
    <div class="page-header">
      <div class="page-block">
        <div class="row align-items-center">
          <div class="col-md-12">
            <div class="page-header-title">
              <h5 class="m-b-10">Delete Task</h5>
            </div>
            <ul class="breadcrumb">
              <li class="breadcrumb-item">
                <a href="{% url 'tasks:task-list' %}">
                  <i class="feather icon-check-square"></i>
                </a>
              </li>
              <li class="breadcrumb-item"><a href="{% url 'tasks:task-list' %}">Tasks</a></li>
              <li class="breadcrumb-item"><a href="#">Delete</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>

    <!-- Delete Confirmation Card -->
    <div class="card">
      <div class="card-header">
        <h5>Confirm Deletion</h5>
      </div>

      <div class="card-body text-center">

        <h4 class="text-danger mb-3">
          Are you sure you want to delete this task?
        </h4>

        <p class="mb-4">
          <strong>{{ task.name }}</strong><br>
          <span class="text-muted">Priority: {{ task.priority }}</span><br>
          <span class="text-muted">Type: {{ task.task_type }}</span>
        </p>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex justify-content-center gap-3">

            <a href="{% url 'tasks:task-detail' task.id %}"
               class="btn btn-outline-secondary me-2">
              <i class="feather icon-arrow-left"></i> Cancel
            </a>

            <button type="submit" class="btn btn-danger">
              <i class="feather icon-trash-2"></i> Delete Task
            </button>

          </div>
        </form>

      </div>
    </div>

  </div>
</div>
{% endblock %}
